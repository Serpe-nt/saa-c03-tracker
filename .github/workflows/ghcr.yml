# Builds the app image and pushes it to GHCR on every push to main that touches saa-plan/.
# Tags: latest, and sha-<short commit> to roll back to (TAG=sha-abc1234 in the server's .env).
name: Publish image

on:
  push:
    branches: [main]
    paths: ["saa-plan/**", ".github/workflows/ghcr.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/serpe-nt/saa-plan
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: saa-plan
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
